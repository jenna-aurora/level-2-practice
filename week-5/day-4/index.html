<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 5 Day 4 — Recipe Finder</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <!-- Main Card -->
          <div class="card shadow-lg border-0">
            <div class="card-body p-4">
              <h1 class="text-center text-success mb-3">🍽️ Recipe Finder</h1>

              <p class="text-center text-muted">
                Choose a recipe number from 1-50 and discover a delicious meal.
              </p>

              <div class="text-center mb-4">
                <a
                  href="../../index.html"
                  class="btn btn-outline-secondary btn-sm"
                >
                  ← All Practice Days
                </a>
              </div>

              <div class="input-group mb-3">
                <input
                  id="recipe-id"
                  type="number"
                  class="form-control"
                  value="1"
                  min="1"
                  max="50"
                />

                <button id="load-btn" class="btn btn-success">
                  Get Recipe
                </button>
              </div>

              <p id="status" class="fw-bold text-center text-primary"></p>

              <div id="recipe" class="mt-4"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
